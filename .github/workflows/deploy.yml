name: CI/CD - Nutrition Advisor ONNX

on:
  push:
    branches:
      - dev
      - prod

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/nutrition-advisor
  NUTRITION_MODEL_LOCAL_PATH: artifacts/models/nutrition_model.onnx
  TEST_DATA_LOCAL_PATH: artifacts/data/nutrition_test_data.csv

jobs:
  test:
    name: test - validar modelo ONNX
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Descargar modelo ONNX desde Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
        run: |
          python scripts/download_from_azure.py \
            --blob "${{ vars.NUTRITION_MODEL_BLOB_NAME }}" \
            --out "${{ env.NUTRITION_MODEL_LOCAL_PATH }}"

      - name: Descargar datos de prueba desde Azure Blob Storage
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
        run: |
          python scripts/download_from_azure.py \
            --blob "${{ vars.TEST_DATA_BLOB_NAME }}" \
            --out "${{ env.TEST_DATA_LOCAL_PATH }}"

      - name: Ejecutar pruebas unitarias del modelo
        env:
          NUTRITION_MODEL_PATH: ${{ env.NUTRITION_MODEL_LOCAL_PATH }}
          TEST_DATA_PATH: ${{ env.TEST_DATA_LOCAL_PATH }}
          MIN_ACCEPTABLE_ACCURACY: ${{ vars.MIN_ACCEPTABLE_ACCURACY }}
        run: |
          pytest -q

  build_promote:
    name: build/promote - construir y desplegar contenedor
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar modelo ONNX para incluirlo en el contenedor
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_CONTAINER_NAME: ${{ vars.AZURE_CONTAINER_NAME }}
        run: |
          python -m pip install azure-storage-blob==12.24.0
          python scripts/download_from_azure.py \
            --blob "${{ vars.NUTRITION_MODEL_BLOB_NAME }}" \
            --out "models/nutrition_model.onnx"

      - name: Determinar ambiente y endpoint
        id: envvars
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "prod" ]; then
            echo "APP_ENV=prod" >> "$GITHUB_OUTPUT"
            echo "CONTAINER_APP=${{ vars.AZURE_CONTAINER_APP_PROD }}" >> "$GITHUB_OUTPUT"
            echo "PREDICTIONS_BLOB=${{ vars.PREDICTIONS_PROD_BLOB_NAME }}" >> "$GITHUB_OUTPUT"
          else
            echo "APP_ENV=dev" >> "$GITHUB_OUTPUT"
            echo "CONTAINER_APP=${{ vars.AZURE_CONTAINER_APP_DEV }}" >> "$GITHUB_OUTPUT"
            echo "PREDICTIONS_BLOB=${{ vars.PREDICTIONS_DEV_BLOB_NAME }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Construir imagen Docker
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:${{ github.ref_name }} \
            .

      - name: Publicar imagen Docker en GHCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Configurar secreto de Storage en Azure Container App
        run: |
          az containerapp secret set \
            --name "${{ steps.envvars.outputs.CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --secrets storage-conn-string="${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

      - name: Desplegar nueva imagen en Azure Container Apps
        run: |
          az containerapp update \
            --name "${{ steps.envvars.outputs.CONTAINER_APP }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ github.sha }}" \
            --set-env-vars \
              APP_ENV="${{ steps.envvars.outputs.APP_ENV }}" \
              NUTRITION_MODEL_PATH="/app/models/nutrition_model.onnx" \
              AZURE_STORAGE_CONNECTION_STRING="secretref:storage-conn-string" \
              AZURE_CONTAINER_NAME="${{ vars.AZURE_CONTAINER_NAME }}" \
              PREDICTIONS_BLOB_NAME="${{ steps.envvars.outputs.PREDICTIONS_BLOB }}"
